<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body class="centro">
  <main class="cartao">
    <h1 id="titulo">Entrar</h1>
    <p class="subtitulo" id="subtitulo">Acesse sua conta para continuar.</p>

    <form id="formulario" novalidate>
      <label id="campo-nome" hidden>Nome
        <input type="text" id="nome" autocomplete="name" maxlength="100">
      </label>
      <label>E-mail
        <input type="email" id="email" autocomplete="email" required>
      </label>
      <label>Senha
        <input type="password" id="senha" autocomplete="current-password" required minlength="6">
      </label>

      <p id="mensagem" class="mensagem" role="alert"></p>

      <button type="submit" id="botao-enviar">Entrar</button>
    </form>

    <p class="alternar">
      <span id="texto-alternar">Não tem conta?</span>
      <button type="button" id="botao-alternar" class="link">Criar conta</button>
    </p>
  </main>

  <script src="login.js"></script>
</body>
</html>
