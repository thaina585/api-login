# Blueprint do Render: cria o site e o banco de dados de uma vez.
# No Render: New > Blueprint > escolha este repositório do GitHub.
services:
  - type: web
    runtime: node
    name: site-login
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: site-login-db
          property: connectionString
      - key: JWT_SEGREDO
        generateValue: true

databases:
  - name: site-login-db
    plan: free
